<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Azure Container Apps Whiteboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=block" rel="stylesheet">
<script src="rough.js"></script>
<style>
  :root { --ink: #333; }
  html, body { margin: 0; height: 100%; background: #fff; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { width: 100vw; height: 100vh; max-width: 100%; }
  text { font-family: 'Architects Daughter', 'Segoe Print', cursive; }
  .step { transition: opacity .5s ease; }
  .step.hidden { opacity: 0; }
</style>
</head>
<body>
<svg id="board" viewBox="0 0 2400 1350" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// Whiteboard overview of Azure Container Apps, revealed one chapter at a time.
// Keys: → / space = next chapter, ← = previous, Home = blank, End = everything.
// URL: ?step=N shows chapters 1..N; ?hud=0 hides the chapter label (for PNG export).

const C = {
  purple: '#6B2C91', blue: '#2A8FD0', darkblue: '#1F5FBF', red: '#E0202A',
  orange: '#F07A20', green: '#4E9F2E', pink: '#D6246E', gray: '#555', env: '#4FB3E8', teal: '#1E8F5A'
};

const CHAPTERS = [
  'What is Container Apps?', 'The environment', 'Container app & ingress', 'Revisions & replicas',
  'Scaling', 'Jobs', 'App-to-app', 'Identity, secrets, logs', 'Pricing',
  'Express — the harness', 'Dynamic sessions — run code once', 'Sandboxes — keep the state', 'Which one?'
];

const svg = document.getElementById('board');
const rc = rough.svg(svg);
const NS = 'http://www.w3.org/2000/svg';
const groups = CHAPTERS.map((_, i) => {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'step hidden');
  g.dataset.step = i + 1;
  svg.appendChild(g);
  return g;
});
let seed = 1;
const opt = (color, o = {}) => ({ stroke: color, strokeWidth: o.w || 3, roughness: o.r ?? 1.1, bowing: 1,
  seed: seed++, strokeLineDash: o.dash ? [12, 10] : undefined });

function R(step, x, y, w, h, color, o) { groups[step - 1].appendChild(rc.rectangle(x, y, w, h, opt(color, o))); }
function E(step, cx, cy, w, h, color, o) { groups[step - 1].appendChild(rc.ellipse(cx, cy, w, h, opt(color, o))); }
function P(step, d, color, o) { groups[step - 1].appendChild(rc.path(d, opt(color, o))); }
function L(step, x1, y1, x2, y2, color, o = {}) {
  const g = groups[step - 1];
  g.appendChild(rc.line(x1, y1, x2, y2, opt(color, o)));
  if (o.arrow === false) return;
  const a = Math.atan2(y2 - y1, x2 - x1), s = 18;
  for (const d of [-0.45, 0.45]) {
    g.appendChild(rc.line(x2, y2, x2 - s * Math.cos(a + d), y2 - s * Math.sin(a + d), opt(color, { w: o.w })));
  }
}
function T(step, x, y, str, color, size, o = {}) {
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', x); t.setAttribute('y', y);
  t.setAttribute('fill', color); t.setAttribute('font-size', size);
  if (o.mid) t.setAttribute('text-anchor', 'middle');
  if (o.end) t.setAttribute('text-anchor', 'end');
  if (o.bold) t.setAttribute('font-weight', 'bold');
  if (o.rot) t.setAttribute('transform', `rotate(${o.rot} ${x} ${y})`);
  t.textContent = str;
  groups[step - 1].appendChild(t);
}

// 1 · What is Container Apps?
T(1, 60, 90, 'AZURE CONTAINER APPS', C.purple, 60);
T(1, 60, 138, 'serverless containers — you bring the image', C.gray, 26);
R(1, 60, 165, 560, 100, C.gray, { dash: true, w: 2 });
T(1, 80, 203, 'under the hood (hidden from you):', C.gray, 22);
T(1, 80, 243, 'Kubernetes · KEDA · Envoy · Dapr', C.gray, 28);

// 2 · The environment
R(2, 150, 290, 1190, 890, C.env, { w: 4 });
T(2, 180, 340, 'ENVIRONMENT', C.blue, 40);
T(2, 180, 378, 'secure boundary · own VNet · shared logs & Dapr config', C.blue, 24);
T(2, 1320, 340, '(consumption-only env = legacy)', C.gray, 20, { end: true });
T(2, 180, 1068, 'WORKLOAD PROFILES — the compute under your apps', C.blue, 24);
R(2, 180, 1082, 540, 80, C.green);
T(2, 198, 1115, 'CONSUMPTION', C.green, 28);
T(2, 198, 1148, 'scale to 0 · pay per second', C.green, 22);
R(2, 760, 1082, 550, 80, C.orange);
T(2, 778, 1115, 'DEDICATED', C.orange, 28);
T(2, 778, 1148, 'fixed nodes · bigger sizes · GPU', C.orange, 22);

// 3 · Container app & ingress
E(3, 75, 640, 46, 46, C.gray);
P(3, 'M45 735 Q45 668 75 668 Q105 668 105 735 Z', C.gray);
T(3, 75, 775, 'USERS', C.gray, 24, { mid: true });
L(3, 112, 690, 214, 668, C.red);
R(3, 200, 410, 700, 620, C.purple, { w: 3.5 });
T(3, 220, 452, 'CONTAINER APP', C.purple, 34);
R(3, 220, 580, 140, 180, C.red);
T(3, 290, 628, 'INGRESS', C.red, 24, { mid: true });
T(3, 290, 662, 'HTTP / TCP', C.red, 20, { mid: true });
T(3, 290, 696, 'internal or', C.red, 19, { mid: true });
T(3, 290, 722, 'external', C.red, 19, { mid: true });
T(3, 290, 790, '(Envoy)', C.red, 20, { mid: true });

// 4 · Revisions & replicas
function replica(step, x, y) {
  R(step, x, y, 130, 140, C.orange);
  T(step, x + 65, y + 34, 'replica', C.orange, 20, { mid: true });
  R(step, x + 15, y + 50, 100, 40, C.orange, { w: 2 });
  T(step, x + 65, y + 77, 'app', C.orange, 20, { mid: true });
  R(step, x + 15, y + 98, 100, 30, C.pink, { w: 2 });
  T(step, x + 65, y + 119, '+ sidecar', C.pink, 17, { mid: true });
}
R(4, 420, 480, 460, 220, C.purple, { dash: true });
T(4, 440, 512, 'REVISION v1', C.purple, 24);
T(4, 860, 512, '80%', C.purple, 26, { end: true });
[440, 585, 730].forEach(x => replica(4, x, 540));
R(4, 420, 730, 460, 220, C.purple, { dash: true });
T(4, 440, 762, 'REVISION v2', C.purple, 24);
T(4, 860, 762, '20%', C.purple, 26, { end: true });
replica(4, 440, 790);
T(4, 650, 860, 'new image or config', C.purple, 20);
T(4, 650, 888, '= new revision', C.purple, 20);
L(4, 362, 640, 416, 600, C.purple);
L(4, 362, 700, 416, 830, C.purple);
T(4, 420, 990, 'single or multiple revisions · blue/green', C.purple, 20);

// 5 · Scaling
T(5, 220, 850, 'SCALE 0 → N', C.green, 24);
T(5, 220, 880, 'on HTTP, CPU,', C.green, 19);
T(5, 220, 906, 'memory or any', C.green, 19);
T(5, 220, 932, 'KEDA event', C.green, 19);
T(5, 220, 966, '(CPU / memory', C.gray, 17);
T(5, 220, 988, 'never reach 0)', C.gray, 17);
P(5, 'M895 520 C925 560 925 640 895 680', C.green, { w: 2.5 });
L(5, 905, 660, 895, 682, C.green, { w: 2.5 });

// 6 · Jobs
R(6, 940, 420, 370, 300, C.orange);
T(6, 960, 458, 'JOB', C.orange, 34);
T(6, 1035, 456, 'start → run → stop', C.orange, 22);
T(6, 960, 505, 'MANUAL — on demand / API', C.orange, 21);
T(6, 960, 545, 'SCHEDULE — cron (UTC)', C.orange, 21);
T(6, 960, 585, 'EVENT — KEDA, e.g. a queue', C.orange, 21);
T(6, 960, 640, 'each run = an execution', C.orange, 21);
T(6, 960, 680, 'no ingress · no Dapr', C.orange, 21);

// 7 · App-to-app
R(7, 940, 770, 370, 150, C.purple);
T(7, 960, 808, 'APP B', C.purple, 30);
T(7, 960, 845, 'internal ingress only', C.purple, 21);
T(7, 960, 880, 'called as http://app-b', C.purple, 21);
L(7, 902, 900, 936, 870, C.purple, { dash: true, w: 2.5 });
T(7, 960, 955, 'service discovery: built-in DNS', C.purple, 20);
T(7, 960, 982, 'Dapr optional (apps only)', C.purple, 20);

// 8 · Identity, secrets, logs
L(8, 300, 1180, 260, 1205, C.env, { arrow: false, w: 2.5 });
L(8, 700, 1180, 660, 1205, C.env, { arrow: false, w: 2.5 });
L(8, 1080, 1180, 1040, 1205, C.env, { arrow: false, w: 2.5 });
T(8, 150, 1238, 'IDENTITY', C.blue, 30);
T(8, 150, 1270, 'managed identity → Key Vault,', C.blue, 21);
T(8, 150, 1298, 'Storage, SQL… no passwords', C.blue, 21);
T(8, 560, 1238, 'SECRETS', C.blue, 30);
T(8, 560, 1270, 'on the app, or as', C.blue, 21);
T(8, 560, 1298, 'Key Vault references', C.blue, 21);
T(8, 920, 1238, 'LOGS', C.blue, 30);
T(8, 920, 1270, 'Log Analytics · OpenTelemetry', C.blue, 21);
T(8, 920, 1298, 'log stream · console', C.blue, 21);

// 9 · Pricing
T(9, 700, 232, '$', C.green, 90);
T(9, 770, 150, 'PRICING', C.green, 30);
T(9, 770, 185, 'consumption: per second, vCPU + GiB', C.green, 21);
T(9, 770, 215, 'free monthly grant · at 0 replicas: no compute bill', C.green, 21);
T(9, 770, 245, 'dedicated: per node + plan management fee', C.green, 21);
T(9, 770, 275, 'Express: consumption meter, no environment fee', C.green, 21);

// 10 · Express — the harness
L(10, 1375, 60, 1375, 1330, C.pink, { dash: true, arrow: false, w: 2 });
T(10, 1420, 90, 'THE AGENTIC ERA', C.pink, 44);
T(10, 1420, 132, 'an agent needs: harness · sandbox · state · speed', C.pink, 26);
R(10, 1420, 165, 940, 270, C.teal, { w: 3.5 });
T(10, 1445, 207, 'EXPRESS', C.teal, 36);
T(10, 1628, 205, '— the harness', C.teal, 26);
T(10, 1445, 250, 'an image → an HTTPS URL · no environment to design', C.teal, 23);
T(10, 1445, 285, 'built on Sandboxes (microVM) → sub-second scale from 0', C.teal, 23);
T(10, 1445, 320, 'for: agent APIs · MCP servers · web apps', C.teal, 23);
T(10, 1445, 362, 'not: sidecars · Dapr · jobs · GPU · custom domains', C.teal, 23);
T(10, 1445, 402, 'HTTP only · one revision · user-assigned identity', C.teal, 21);

// 11 · Dynamic sessions — run code once
R(11, 1420, 465, 940, 350, C.darkblue, { w: 3.5 });
T(11, 1445, 507, 'DYNAMIC SESSIONS', C.darkblue, 36);
T(11, 1790, 505, '— run code once', C.darkblue, 26);
R(11, 1445, 535, 330, 180, C.darkblue, { dash: true, w: 2.5 });
T(11, 1462, 566, 'SESSION POOL', C.darkblue, 22);
[0, 1, 2, 3].forEach(i => R(11, 1465 + i * 75, 590, 55, 55, C.darkblue, { w: 2 }));
T(11, 1610, 690, 'prewarmed, waiting', C.darkblue, 19, { mid: true });
L(11, 1805, 590, 1740, 615, C.darkblue);
T(11, 1810, 580, 'request ?identifier=user-42', C.darkblue, 21);
T(11, 1810, 620, 'same id → same session', C.darkblue, 21);
T(11, 1810, 660, 'Hyper-V · egress off by default', C.darkblue, 21);
T(11, 1810, 700, 'idle cooldown → destroyed', C.darkblue, 21);
T(11, 1445, 760, 'code interpreter: Python · Node · Shell — no environment needed', C.darkblue, 20);
T(11, 1445, 792, 'custom container: your image — needs a workload-profiles environment', C.darkblue, 20);

// 12 · Sandboxes — keep the state
R(12, 1420, 845, 940, 335, C.purple, { w: 3.5 });
T(12, 1445, 887, 'SANDBOXES', C.purple, 36);
T(12, 1668, 885, '— keep the state', C.purple, 26);
T(12, 2340, 885, '(sandbox group = boundary)', C.purple, 19, { end: true });
R(12, 1445, 910, 260, 205, C.darkblue, { w: 3 });
T(12, 1575, 942, 'MICRO VM', C.darkblue, 24, { mid: true });
R(12, 1465, 958, 220, 55, C.orange, { w: 2 });
T(12, 1575, 993, 'your image', C.orange, 21, { mid: true });
R(12, 1465, 1028, 220, 65, C.darkblue, { w: 2 });
T(12, 1575, 1068, 'own Linux kernel', C.darkblue, 21, { mid: true });
R(12, 1725, 910, 60, 205, C.red, { w: 3 });
T(12, 1762, 1012, 'EGRESS', C.red, 22, { mid: true, rot: -90 });
L(12, 1788, 960, 1850, 960, C.red);
T(12, 1445, 1152, 'egress rules: allow / deny by domain or CIDR', C.red, 20);
T(12, 1880, 940, 'CREATE → RUNNING → STOPPED → DELETE', C.pink, 21);
T(12, 1880, 980, 'stop = snapshot (memory + disk)', C.pink, 21);
T(12, 1880, 1015, 'resume in < 1 s, right where it was', C.pink, 21);
T(12, 1880, 1055, 'auto-suspend when idle · auto-delete', C.pink, 21);
T(12, 1880, 1100, 'volumes: Blob (1:many) · Disk (1:1)', C.purple, 21);

// 13 · Which one?
T(13, 1420, 1238, 'WHICH ONE?', C.gray, 30);
T(13, 1420, 1272, 'always-on service → APP  ·  finite task → JOB  ·  fast agent API → EXPRESS', '#333', 21);
T(13, 1420, 1304, 'LLM code, run once → SESSION  ·  agent workspace with memory → SANDBOX', '#333', 21);

// Chapter label (top right)
const hud = document.createElementNS(NS, 'text');
hud.setAttribute('x', 2370); hud.setAttribute('y', 36);
hud.setAttribute('text-anchor', 'end'); hud.setAttribute('font-size', 20); hud.setAttribute('fill', '#999');
svg.appendChild(hud);

const params = new URLSearchParams(location.search);
if (params.get('hud') === '0') hud.style.display = 'none';
let current = Math.max(0, Math.min(CHAPTERS.length, parseInt(params.get('step') ?? '1', 10) || 0));

function show(n) {
  current = Math.max(0, Math.min(CHAPTERS.length, n));
  groups.forEach((g, i) => g.classList.toggle('hidden', i >= current));
  hud.textContent = current ? `${current} / ${CHAPTERS.length} · ${CHAPTERS[current - 1]}` : '';
  if (params.has('step')) return;
  history.replaceState(null, '', `#${current}`);
}
if (!params.has('step') && location.hash) current = parseInt(location.hash.slice(1), 10) || current;
show(current);

addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) show(current + 1);
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) show(current - 1);
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(CHAPTERS.length);
  else return;
  e.preventDefault();
});
svg.addEventListener('click', () => show(current + 1));
</script>
</body>
</html>
