<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 980" width="1700" height="980" font-family="Aptos, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <rect width="1700" height="980" fill="#fff"/>

  <!-- Virtual network -->
  <rect x="270" y="30" width="1400" height="920" rx="18" fill="#FAFBFC" stroke="#A3ABB5" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="300" y="78" font-size="30" font-weight="600" fill="#5B6470">Virtual network</text>

  <!-- front environment -->
  <rect x="310" y="110" width="500" height="400" rx="14" fill="#F1ECF6" stroke="#C9B6DA" stroke-width="2"/>
  <text x="335" y="150" font-size="26" font-weight="600" fill="#5B6470">front environment · public</text>
  <rect x="350" y="190" width="420" height="200" rx="10" fill="#7E2FA0"/>
  <text x="560" y="270" font-size="42" font-weight="600" text-anchor="middle" fill="#fff">agent-api</text>
  <text x="560" y="312" font-size="25" text-anchor="middle" fill="#fff" fill-opacity="0.9">own identity · no DB role</text>
  <text x="560" y="348" font-size="25" text-anchor="middle" fill="#fff" fill-opacity="0.9">no connection string</text>

  <!-- Express environment, egresses into the VNet -->
  <rect x="240" y="600" width="570" height="300" rx="14" fill="#F1ECF6" stroke="#C9B6DA" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="265" y="640" font-size="26" font-weight="600" fill="#5B6470">Express environment · VNet egress</text>
  <rect x="350" y="675" width="420" height="190" rx="10" fill="#A55BC4"/>
  <text x="560" y="755" font-size="42" font-weight="600" text-anchor="middle" fill="#fff">agent-api</text>
  <text x="560" y="800" font-size="25" text-anchor="middle" fill="#fff" fill-opacity="0.9">Express variant</text>

  <!-- Engineer -->
  <circle cx="95" cy="420" r="38" fill="#3B3F45"/>
  <path d="M35 540 C35 490 63 470 95 470 C127 470 155 490 155 540 Z" fill="#3B3F45"/>
  <text x="95" y="590" font-size="30" text-anchor="middle" fill="#222">Engineer</text>
  <line x1="165" y1="460" x2="346" y2="300" stroke="#222" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="165" y1="530" x2="346" y2="800" stroke="#222" stroke-width="4" marker-end="url(#ah)"/>

  <!-- plant environment -->
  <rect x="900" y="110" width="730" height="800" rx="14" fill="#EEF4FB" stroke="#B5CBE3" stroke-width="2"/>
  <text x="925" y="145" font-size="26" font-weight="600" fill="#5B6470">plant environment · internal load balancer</text>

  <rect x="950" y="190" width="300" height="160" rx="10" fill="#2D6FAE"/>
  <text x="1100" y="262" font-size="38" font-weight="600" text-anchor="middle" fill="#fff">alarm-tools</text>
  <text x="1100" y="305" font-size="25" text-anchor="middle" fill="#fff" fill-opacity="0.9">role alarm_tools</text>

  <rect x="1290" y="190" width="300" height="160" rx="10" fill="#2D6FAE"/>
  <text x="1440" y="262" font-size="38" font-weight="600" text-anchor="middle" fill="#fff">docs-tools</text>
  <text x="1440" y="305" font-size="25" text-anchor="middle" fill="#fff" fill-opacity="0.9">role docs_tools</text>

  <rect x="950" y="470" width="640" height="160" rx="10" fill="#3C34A3"/>
  <text x="1270" y="542" font-size="40" font-weight="600" text-anchor="middle" fill="#fff">Postgres + pgvector</text>
  <text x="1270" y="585" font-size="25" text-anchor="middle" fill="#fff" fill-opacity="0.9">one role per app · table-level grants</text>

  <rect x="950" y="740" width="300" height="140" rx="10" fill="#2E9B4F"/>
  <text x="1100" y="802" font-size="36" font-weight="600" text-anchor="middle" fill="#fff">indexer</text>
  <text x="1100" y="842" font-size="25" text-anchor="middle" fill="#fff" fill-opacity="0.9">job · role indexer</text>

  <rect x="1290" y="740" width="300" height="140" rx="10" fill="#2E9B4F"/>
  <text x="1440" y="802" font-size="34" font-weight="600" text-anchor="middle" fill="#fff">simulator + NATS</text>
  <text x="1440" y="842" font-size="25" text-anchor="middle" fill="#fff" fill-opacity="0.9">role simulator</text>

  <!-- agent-api (front) -> tools over the internal load balancer -->
  <line x1="770" y1="270" x2="946" y2="270" stroke="#222" stroke-width="4" marker-end="url(#ah)"/>
  <path d="M770 230 L860 230 L860 175 L1440 175 L1440 186" fill="none" stroke="#222" stroke-width="4" marker-end="url(#ah)"/>

  <!-- Express agent-api -> same tools -->
  <path d="M770 770 L860 770 L860 330 L946 330" fill="none" stroke="#222" stroke-width="4" marker-end="url(#ah)"/>

  <!-- data paths -->
  <line x1="1100" y1="350" x2="1100" y2="466" stroke="#222" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="1440" y1="350" x2="1440" y2="466" stroke="#222" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="1100" y1="740" x2="1100" y2="634" stroke="#222" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="1440" y1="740" x2="1440" y2="634" stroke="#222" stroke-width="4" marker-end="url(#ah)"/>
</svg>
