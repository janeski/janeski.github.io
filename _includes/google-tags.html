<!-- Google tags: GA4 (gtag.js) + Google Tag Manager. One dataLayer, one gtag() definition. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  {% if site.google_analytics %}gtag('config', '{{ site.google_analytics }}');{% endif %}
</script>
{% if site.google_analytics %}<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>{% endif %}
{% if site.google_tag_manager %}<script async src="https://www.googletagmanager.com/gtm.js?id={{ site.google_tag_manager }}"></script>{% endif %}
